services:
  kerp-frontend:
    build: .
    args:
      NEXT_PUBLIC_N8N_INVOICE_OCR: ${NEXT_PUBLIC_N8N_INVOICE_OCR}
      NEXT_PUBLIC_N8N_PURCHASE_ORDER_OCR: ${NEXT_PUBLIC_N8N_PURCHASE_ORDER_OCR}
      NEXT_PUBLIC_N8N_RESUME_STATICS: ${NEXT_PUBLIC_N8N_RESUME_STATICS}
    container_name: kerp-frontend
    restart: unless-stopped
    env_file:
      - .env.prod
    networks: 
      - ms-net
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # Nginx tuning
      - BACKEND_URL=${BACKEND_URL:-http://gateway-server:8089}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - NGINX_MAX_FILE_SIZE=${NGINX_MAX_FILE_SIZE:-1GB}
      - NGINX_PROXY_READ_TIMEOUT=${NGINX_PROXY_READ_TIMEOUT:-300}
      - NGINX_PROXY_CONNECT_TIMEOUT=${NGINX_PROXY_CONNECT_TIMEOUT:-75}
      - NGINX_PROXY_SEND_TIMEOUT=${NGINX_PROXY_SEND_TIMEOUT:-300}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template
      - /dev/null:/etc/nginx/conf.d/default.conf
    depends_on:
      - kerp-frontend
    restart: unless-stopped
    networks: 
      - ms-net

networks:
  ms-net:
    external: true
